<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CF Minutes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
  :root {
    --blue: #0129AC; --blue-2: #0B57E0; --blue-soft: #E8EEFC; --ink: #0E1A33; --text: #25324D; --muted: #5E6B85; --faint: #8A95AB;

    --red: #C62828; --red-soft: #FDECEC; --ok: #17794A; --ok-soft: #E6F4EC; --warn: #9A5B00; --warn-soft: #FFF3DC;

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--blue-2); outline-offset: 2px; }
  h1, h2, h3 { margin: 0; color: var(--ink); font-weight: 600; letter-spacing: -.01em; }
  .muted { color: var(--muted); } .faint { color: var(--faint); }

  #app { display: grid; grid-template-columns: 290px 1fr; height: 100vh; }
  aside { display: flex; flex-direction: column; min-height: 0; background: var(--card); border-right: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 12px; font-weight: 600; color: var(--ink); font-size: 15px; }
  .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 600; }
  .rec-btn { margin: 4px 16px 12px; height: 42px; border-radius: 9px; border: 0; background: var(--blue); color: #fff; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 9px; transition: background .15s; }
  .rec-btn:hover { background: #0a35c4; }
  .rec-btn.stop { background: var(--red); } .rec-btn.stop:hover { background: #a91f1f; }
  .rec-btn .dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; }

  .search { margin: 0 16px 8px; position: relative; }

  #list { flex: 1; overflow-y: auto; padding: 4px 8px 12px; min-height: 0; }
  .day { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 12px 10px 5px; }

  .item:hover { background: var(--bg); } .item.on { background: var(--blue-soft); border-left-color: var(--blue); }

  .item > span { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tagline { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; margin-left: 6px; vertical-align: 1px; }
  .tagline.busy { background: var(--warn-soft); color: var(--warn); } .tagline.err { background: var(--red-soft); color: var(--red); } .tagline.rec { background: var(--red-soft); color: var(--red); }
  .side-foot { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .link { background: none; border: 0; color: var(--blue); font-weight: 500; padding: 4px 6px; border-radius: 6px; } .link:hover { background: var(--blue-soft); }
  .link.danger { color: var(--red); } .link.danger:hover { background: var(--red-soft); }

  main { overflow-y: auto; min-width: 0; position: relative; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 34px 120px; }
  .banner { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 9px; margin-bottom: 14px; font-size: 13px; }
  .banner.warn { background: var(--warn-soft); color: var(--warn); } .banner.info { background: var(--blue-soft); color: var(--blue); } .banner.bad { background: var(--red-soft); color: var(--red); }

  .btn:hover { background: var(--bg); } .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; } .btn.primary:hover { background: #0a35c4; }
  .btn svg { width: 15px; height: 15px; } .btn:disabled { opacity: .5; cursor: default; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; }

  /* home */
  .hero { padding: 30px 0 10px; } .hero h1 { font-size: 28px; line-height: 1.2; max-width: 620px; }
  .hero p { max-width: 600px; color: var(--muted); font-size: 15px; margin: 10px 0 20px; }
  .how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 26px; }
  .how .card h3 { font-size: 14px; margin-bottom: 4px; } .how .card p { margin: 0; font-size: 13px; color: var(--muted); }
  .status-row { display: flex; align-items: center; gap: 9px; margin-top: 22px; font-size: 13px; color: var(--muted); }
  .led { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); } .led.off { background: var(--line-2); }

  /* live */
  .live-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .live-head h2 { font-size: 20px; } .timer { font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 500; color: var(--red); }
  .pulse { width: 12px; height: 12px; border-radius: 50%; background: var(--red); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(198, 40, 40, .5); } 70% { box-shadow: 0 0 0 10px rgba(198, 40, 40, 0); } 100% { box-shadow: 0 0 0 0 rgba(198, 40, 40, 0); } }
  .meters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .meter { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 12.5px; }
  .meter .bar { flex: 1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; } .meter .bar i { display: block; height: 100%; width: 0; background: var(--blue-2); transition: width .12s linear; }
  .meter b { font-weight: 500; color: var(--ink); min-width: 52px; }
  .stream { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px 0; min-height: 280px; max-height: calc(100vh - 330px); overflow-y: auto; }
  .consent { margin-top: 12px; font-size: 12px; color: var(--faint); }

  /* transcript lines */
  .ln { display: grid; grid-template-columns: 52px 128px 1fr; gap: 10px; padding: 8px 16px; align-items: baseline; border-left: 3px solid transparent; }
  .ln:hover { background: #FAFBFE; } .ln.now { background: var(--blue-soft); border-left-color: var(--blue); }
  .ln .tm { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; background: none; border: 0; padding: 0; text-align: left; } .ln .tm:hover { color: var(--blue); }
  .ln .who { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: none; border: 0; padding: 0; text-align: left; } .ln .who:hover { text-decoration: underline; }
  .ln .tx { color: var(--ink); } .ln.partial .tx { color: var(--faint); font-style: italic; }
  .empty { padding: 40px; text-align: center; color: var(--faint); }

  /* meeting */

  .mhead input.title:hover { border-bottom-color: var(--line); } .mhead input.title:focus { border-bottom-color: var(--blue); outline: none; }
  .mmeta { color: var(--muted); font-size: 13px; margin: 4px 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
  .chip { border: 1px solid var(--line-2); background: var(--card); border-radius: 7px; padding: 3px 10px; font-size: 12.5px; color: var(--ink); display: inline-flex; align-items: center; gap: 7px; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .tab { background: none; border: 0; padding: 9px 14px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; } .tab.on { color: var(--blue); border-bottom-color: var(--blue); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .sec { margin-bottom: 22px; } .sec h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--blue); margin-bottom: 8px; }
  .sec ul { margin: 0; padding-left: 20px; } .sec li { margin: 5px 0; color: var(--ink); }
  table.act { width: 100%; border-collapse: collapse; font-size: 13.5px; } table.act th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 500; padding: 6px 10px; border-bottom: 1px solid var(--line-2); }
  table.act td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink); } table.act td:first-child { font-weight: 500; white-space: nowrap; }
  textarea.ed, input.ed { width: 100%; border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; font: inherit; color: var(--ink); background: var(--card); resize: vertical; }
  .steps { margin: 18px 0 0; padding: 0; list-style: none; } .steps li { display: flex; align-items: center; gap: 10px; padding: 7px 0; color: var(--faint); } .steps li.done { color: var(--ok); } .steps li.cur { color: var(--ink); font-weight: 500; }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--blue); animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  .find { display: flex; gap: 10px; margin-bottom: 12px; } .find input, .find select { height: 36px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 10px; font: inherit; background: var(--card); color: var(--ink); } .find input { flex: 1; }
  .foot-actions { margin-top: 28px; display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; }

  /* player */
  #player { position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 34px; display: none; align-items: center; gap: 14px; }
  #player.on { display: flex; } #player input[type=range] { flex: 1; accent-color: var(--blue); } #player .t { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
  .play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--blue); color: #fff; display: grid; place-items: center; } .play svg { width: 16px; height: 16px; }

  /* settings */

  .row b { font-weight: 500; color: var(--ink); display: block; } .row small { color: var(--muted); font-size: 12.5px; }
  .row input[type=text], .row input[type=password], .row input[type=number], .row select { height: 36px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 10px; font: inherit; min-width: 220px; }
  .switch { width: 42px; height: 24px; border-radius: 12px; border: 0; background: var(--line-2); position: relative; flex: none; } .switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch.on { background: var(--blue); } .switch.on::after { transform: translateX(18px); }
  .err-text { color: var(--red); font-size: 13px; margin-top: 8px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand"><span class="mark">CF</span>CF Minutes</div>
    <button class="rec-btn" id="recBtn"><span class="dot"></span><span id="recLabel">Record a meeting</span></button>

    <div id="list"></div>
    <div class="side-foot"><span id="who"></span><button class="link" id="settingsBtn">Settings</button></div>

<script>

  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
  redo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>',

// ---------------------------------------------------------------- sidebar

function renderRec() {
  const b = $("#recBtn"); b.classList.toggle("stop", !!S.recording);
  $("#recLabel").textContent = S.recording ? "Stop recording" : "Record a meeting";
  $("#who").textContent = S.you || "";

$("#recBtn").onclick = async () => {
  if (S.recording) { const r = await api().stop(); if (r && r.id) showMeeting(r.id); }
  else { const r = await api().start(""); if (r && !r.ok) alert(r.error); else showLive(); }

// ---------------------------------------------------------------- views

  setView("home", h("div", { class: "wrap" }, keyBanner, sug,
    h("div", { class: "hero" }, h("h1", { text: "Every meeting, written down with names and minutes." }),
      h("p", { text: "CF Minutes hears you and everyone else on the call, from Teams or any other app, keeps the transcript with who said what, and writes short minutes with decisions and action items. It all stays on this laptop." }),
      h("button", { class: "btn primary", onclick: () => $("#recBtn").click() }, "Record a meeting")),
    h("div", { class: "how" },
      h("div", { class: "card" }, h("h3", { text: "Starts by itself in Teams" }), h("p", { text: "When a Teams meeting begins it starts listening, and stops when the meeting ends. For Zoom, Meet or anything else, press Record." })),
      h("div", { class: "card" }, h("h3", { text: "Both sides, with names" }), h("p", { text: "Your microphone and the sound the laptop plays are kept as two tracks. Other people are named from the Teams roster and what is said." })),
      h("div", { class: "card" }, h("h3", { text: "Minutes in a minute" }), h("p", { text: "A short summary, decisions, and action items with owners. Edit them, copy them, or save as Word." }))),
    h("div", { class: "status-row" }, h("span", { class: "led" + (S.auto ? "" : " off") }), S.auto ? "Listening for Teams meetings" : "Automatic start is off (Settings)")));
}

// ---- live
function showLive() {

  const barY = h("i"), barO = h("i");
  const stream = h("div", { class: "stream" });
  const notes = h("div"), roster = h("div", { class: "muted", style: "font-size:12.5px;margin-bottom:10px" });

    h("div", { class: "meters" }, h("div", { class: "meter" }, h("b", { text: "You" }), h("span", { class: "bar" }, barY)), h("div", { class: "meter" }, h("b", { text: "Others" }), h("span", { class: "bar" }, barO))),
