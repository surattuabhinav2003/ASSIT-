<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CF Minutes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
  :root {
    --blue: #0129AC; --blue-2: #0B57E0; --blue-soft: #E8EEFC; --ink: #0E1A33; --text: #25324D; --muted: #5E6B85; --faint: #8A95AB;
    --bg: #F4F7FB; --card: #FFFFFF; --line: #DCE3EF; --line-2: #C9D3E4;
    --red: #C62828; --red-soft: #FDECEC; --ok: #17794A; --ok-soft: #E6F4EC; --warn: #9A5B00; --warn-soft: #FFF3DC;
    /* Nirmala UI draws Telugu: Poppins has no Telugu letters */
    --font: "Poppins", "Nirmala UI", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 400 14px/1.55 var(--font); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--blue-2); outline-offset: 2px; }
  h1, h2, h3 { margin: 0; color: var(--ink); font-weight: 600; letter-spacing: -.01em; }
  .muted { color: var(--muted); } .faint { color: var(--faint); }

  #app { display: grid; grid-template-columns: 236px 1fr; height: 100vh; }
  aside { display: flex; flex-direction: column; min-height: 0; background: var(--card); border-right: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 12px; font-weight: 600; color: var(--ink); font-size: 15px; }
  .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 600; }
  .rec-btn { margin: 4px 16px 14px; height: 42px; border-radius: 9px; border: 0; background: var(--blue); color: #fff; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 9px; }
  .rec-btn:hover { background: #0a35c4; } .rec-btn.stop { background: var(--red); } .rec-btn.stop:hover { background: #a91f1f; }
  .rec-btn .dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; } .rec-btn.stop .dot { border-radius: 2px; }
  nav { padding: 0 10px; display: flex; flex-direction: column; gap: 2px; }
  .nav { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 8px; font-weight: 500; color: var(--text); border-left: 3px solid transparent; }
  .nav svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
  .nav:hover { background: var(--bg); } .nav.on { background: var(--blue-soft); color: var(--blue); border-left-color: var(--blue); } .nav.on svg { color: var(--blue); }
  .nav .count { margin-left: auto; font-size: 11px; font-weight: 600; background: var(--warn-soft); color: var(--warn); padding: 1px 7px; border-radius: 4px; }
  .grow-1 { flex: 1; }
  .side-foot { border-top: 1px solid var(--line); padding: 12px 16px; font-size: 12px; color: var(--muted); }
  .side-foot b { display: block; color: var(--ink); font-weight: 500; font-size: 13px; }

  main { overflow-y: auto; min-width: 0; position: relative; }
  .wrap { max-width: 1020px; margin: 0 auto; padding: 24px 34px 110px; }
  #recbar { position: sticky; top: 0; z-index: 5; display: none; align-items: center; gap: 12px; padding: 9px 34px; background: var(--red-soft); color: var(--red); border-bottom: 1px solid #F3C7C7; font-weight: 500; }
  #recbar.on { display: flex; } #recbar .grow-1 { flex: 1; }
  .pulse { width: 11px; height: 11px; border-radius: 50%; background: var(--red); animation: pulse 1.6s infinite; flex: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(198, 40, 40, .5); } 70% { box-shadow: 0 0 0 9px rgba(198, 40, 40, 0); } 100% { box-shadow: 0 0 0 0 rgba(198, 40, 40, 0); } }

  .pagehead { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; min-height: 40px; }
  .pagehead h1 { font-size: 26px; } .pagehead .sub { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .back { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px 0 9px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--card); font-weight: 500; color: var(--ink); flex: none; }
  .back:hover { background: var(--blue-soft); border-color: var(--blue-2); color: var(--blue); } .back svg { width: 16px; height: 16px; }

  .banner { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 9px; margin-bottom: 14px; font-size: 13px; }
  .banner.warn { background: var(--warn-soft); color: var(--warn); } .banner.info { background: var(--blue-soft); color: var(--blue); } .banner.bad { background: var(--red-soft); color: var(--red); }
  .banner .grow { flex: 1; }
  .btn { height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--card); font-weight: 500; color: var(--ink); display: inline-flex; align-items: center; gap: 7px; }
  .btn:hover { background: var(--bg); } .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; } .btn.primary:hover { background: #0a35c4; }
  .btn.red { background: var(--red); border-color: var(--red); color: #fff; } .btn.red:hover { background: #a91f1f; }
  .btn.big { height: 44px; padding: 0 22px; font-size: 14.5px; } .btn svg { width: 15px; height: 15px; } .btn:disabled { opacity: .5; cursor: default; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; }
  .card h3 { font-size: 15px; margin-bottom: 4px; } .card .hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; }

  /* home */
  .recordcard { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; margin-bottom: 16px; border-left: 4px solid var(--blue); }
  .recordcard.live { border-left-color: var(--red); background: #FFFAFA; }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--card); margin-top: 10px; }
  .seg button { border: 0; background: none; padding: 8px 14px; font-weight: 500; color: var(--muted); border-right: 1px solid var(--line); } .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--blue); color: #fff; } .seg button:not(.on):hover { background: var(--bg); }
  .status-row { display: flex; align-items: center; gap: 9px; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
  .led { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); } .led.off { background: var(--line-2); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } @media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } }
  .listrow { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px 8px; border-radius: 8px; border-bottom: 1px solid var(--line); }
  .listrow:last-child { border-bottom: 0; } .listrow:hover { background: var(--bg); }
  .listrow b { display: block; font-weight: 500; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .listrow > span { display: block; font-size: 12.5px; color: var(--muted); }
  .listrow .due { color: var(--blue); font-weight: 500; }
  .more { margin-top: 8px; }
  .link { background: none; border: 0; color: var(--blue); font-weight: 500; padding: 4px 6px; border-radius: 6px; } .link:hover { background: var(--blue-soft); }
  .link.danger { color: var(--red); } .link.danger:hover { background: var(--red-soft); }
  .tagline { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; margin-left: 6px; vertical-align: 1px; }
  .tagline.busy { background: var(--warn-soft); color: var(--warn); } .tagline.err { background: var(--red-soft); color: var(--red); } .tagline.rec { background: var(--red-soft); color: var(--red); } .tagline.lang { background: var(--blue-soft); color: var(--blue); }
  .empty { padding: 34px; text-align: center; color: var(--faint); }

  /* meetings page */
  .find { display: flex; gap: 10px; margin-bottom: 12px; } .find input, .find select { height: 38px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 12px; font: inherit; background: var(--card); color: var(--ink); } .find input { flex: 1; }
  .day { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 16px 4px 6px; }
  .mrow { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; }
  .mrow:hover { border-color: var(--blue-2); box-shadow: 0 1px 0 var(--blue-2); }
  .mrow b { font-weight: 600; color: var(--ink); font-size: 14.5px; } .mrow .m2 { color: var(--muted); font-size: 12.5px; margin-top: 2px; } .mrow .m3 { color: var(--text); font-size: 13px; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* live */
  .live-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .timer { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 500; color: var(--red); }
  .meters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .meter { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 12.5px; }
  .meter .bar { flex: 1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; } .meter .bar i { display: block; height: 100%; width: 0; background: var(--blue-2); transition: width .12s linear; }
  .meter b { font-weight: 500; color: var(--ink); min-width: 52px; }
  .stream { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px 0; min-height: 260px; max-height: calc(100vh - 360px); overflow-y: auto; }
  .consent { margin-top: 12px; font-size: 12px; color: var(--faint); }
  .ln { display: grid; grid-template-columns: 52px 128px 1fr; gap: 10px; padding: 8px 16px; align-items: baseline; border-left: 3px solid transparent; }
  .ln:hover { background: #FAFBFE; } .ln.now { background: var(--blue-soft); border-left-color: var(--blue); }
  .ln .tm { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; background: none; border: 0; padding: 0; text-align: left; } .ln .tm:hover { color: var(--blue); }
  .ln .who { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: none; border: 0; padding: 0; text-align: left; } .ln .who:hover { text-decoration: underline; }
  .ln .tx { color: var(--ink); } .ln.partial .tx { color: var(--faint); font-style: italic; }

  /* meeting */
  .mhead input.title { width: 100%; border: 0; border-bottom: 2px solid transparent; background: none; font: 600 26px/1.25 var(--font); color: var(--ink); padding: 2px 0; letter-spacing: -.01em; }
  .mhead input.title:hover { border-bottom-color: var(--line); } .mhead input.title:focus { border-bottom-color: var(--blue); outline: none; }
  .mmeta { color: var(--muted); font-size: 13px; margin: 4px 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
  .chip { border: 1px solid var(--line-2); background: var(--card); border-radius: 7px; padding: 3px 10px; font-size: 12.5px; color: var(--ink); display: inline-flex; align-items: center; gap: 7px; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .tab { background: none; border: 0; padding: 9px 14px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; } .tab.on { color: var(--blue); border-bottom-color: var(--blue); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .sec { margin-bottom: 22px; } .sec h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--blue); margin-bottom: 8px; }
  .sec ul { margin: 0; padding-left: 20px; } .sec li { margin: 5px 0; color: var(--ink); }
  table.act { width: 100%; border-collapse: collapse; font-size: 13.5px; } table.act th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 500; padding: 6px 10px; border-bottom: 1px solid var(--line-2); }
  table.act td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink); } table.act td:first-child { font-weight: 500; white-space: nowrap; }
  textarea.ed, input.ed { width: 100%; border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; font: inherit; color: var(--ink); background: var(--card); resize: vertical; }
  .steps { margin: 18px 0 0; padding: 0; list-style: none; } .steps li { display: flex; align-items: center; gap: 10px; padding: 7px 0; color: var(--faint); } .steps li.done { color: var(--ok); } .steps li.cur { color: var(--ink); font-weight: 500; }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--blue); animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  .foot-actions { margin-top: 28px; display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; }

  #player { position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 34px; display: none; align-items: center; gap: 14px; }
  #player.on { display: flex; } #player input[type=range] { flex: 1; accent-color: var(--blue); } #player .t { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
  .play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--blue); color: #fff; display: grid; place-items: center; } .play svg { width: 16px; height: 16px; }

  /* settings */
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--line); } .row:last-child { border-bottom: 0; }
  .row b { font-weight: 500; color: var(--ink); display: block; } .row small { color: var(--muted); font-size: 12.5px; }
  .row input[type=text], .row input[type=password], .row input[type=number], .row select { height: 36px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 10px; font: inherit; min-width: 220px; background: var(--card); color: var(--ink); }
  .switch { width: 42px; height: 24px; border-radius: 12px; border: 0; background: var(--line-2); position: relative; flex: none; } .switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch.on { background: var(--blue); } .switch.on::after { transform: translateX(18px); }
  .err-text { color: var(--red); font-size: 13px; margin-top: 8px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand"><span class="mark">CF</span>CF Minutes</div>
    <button class="rec-btn" id="recBtn"><span class="dot"></span><span id="recLabel">Record a meeting</span></button>
    <nav>
      <button class="nav" data-page="home" id="navHome"></button>
      <button class="nav" data-page="meetings" id="navMeetings"></button>
      <button class="nav" data-page="settings" id="navSettings"></button>
    </nav>
    <div class="grow-1"></div>
    <div class="side-foot"><b id="who"></b>Kept only on this laptop</div>
  </aside>
  <main id="main"><div id="recbar"></div><div id="view"></div><div id="player"></div></main>
</div>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (k === "text") e.textContent = v; else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
const SVG = (inner) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const ICON = {   // fixed markup only, never user text
  home: SVG('<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>'), meetings: SVG('<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>'),
  settings: SVG('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'),
  back: SVG('<path d="M19 12H5m0 0l6-6m-6 6l6 6"/>'), copy: SVG('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>'),
  down: SVG('<path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/>'), edit: SVG('<path d="M4 20h4L19 9l-4-4L4 16v4z"/>'), redo: SVG('<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>'),
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>', pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
};
const icon = (n) => { const s = document.createElement("span"); s.innerHTML = ICON[n]; return s.firstChild; };
const PALETTE = ["#0129AC", "#0B7A75", "#B45309", "#475569", "#1D6FA5", "#9A3412", "#166534", "#7C5A00"];
const _seen = {};
const colorOf = (n) => { if (!(n in _seen)) _seen[n] = PALETTE[Object.keys(_seen).length % PALETTE.length]; return _seen[n]; };
const stamp = (s) => { s = Math.max(0, Math.floor(s || 0)); const m = Math.floor(s / 60), r = s % 60; return s >= 3600 ? `${Math.floor(s / 3600)}:${String(m % 60).padStart(2, "0")}:${String(r).padStart(2, "0")}` : `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`; };
const api = () => window.pywebview.api;
const LANGS = { en: "English", te: "Telugu", mixed: "Telugu and English mixed" };
const langName = (l) => LANGS[l] || "English";

let S = { recording: false, key: true, language: "en", elapsed: 0 }, meetings = [], current = null;
let hist = [], cur = { page: "home" }, liveTimer = null, tab = "minutes", editing = false, filterQ = "", clock = null, elapsedAt = 0;

// ---------------------------------------------------------------- navigation: every inner page has a Back button
const PAGE_NAME = { home: "Home", meetings: "Meetings", settings: "Settings", live: "the live recording", meeting: "the meeting" };
function go(page, arg, replace) { if (!replace) hist.push(cur); cur = { page, arg }; if (hist.length > 30) hist.shift(); render(); }
function goTop(page) { hist = []; cur = { page }; render(); }       // the three sidebar entries start fresh
function back() { cur = hist.pop() || { page: "home" }; render(); }
function backBtn() {
  const prev = hist[hist.length - 1] || { page: "home" };
  return h("button", { class: "back", onclick: back, title: "Back" }, icon("back"), "Back to " + (PAGE_NAME[prev.page] || "Home"));
}
function render() {
  stopLivePolling(); hidePlayer();
  $("#main").scrollTop = 0;
  const on = cur.page === "meeting" ? "meetings" : cur.page === "live" ? "home" : cur.page;
  document.querySelectorAll(".nav").forEach((b) => b.classList.toggle("on", b.dataset.page === on));
  ({ home: renderHome, meetings: renderMeetings, settings: renderSettings, live: renderLive, meeting: renderMeetingPage }[cur.page] || renderHome)();
  renderRecBar();
}
for (const [id, label, ic] of [["navHome", "Home", "home"], ["navMeetings", "Meetings", "meetings"], ["navSettings", "Settings", "settings"]]) {
  const b = $("#" + id); b.append(icon(ic), label); b.onclick = () => goTop(b.dataset.page);
}
function setView(node) { $("#view").replaceChildren(node); }

// ---------------------------------------------------------------- the record button and the recording bar
function renderRec() {
  const b = $("#recBtn"); b.classList.toggle("stop", !!S.recording);
  $("#recLabel").textContent = S.recording ? "Stop recording" : "Record a meeting";
  $("#who").textContent = S.you || "";
  const n = meetings.filter((m) => m.status === "processing").length;
  const nav = $("#navMeetings"); nav.querySelector(".count")?.remove(); if (n) nav.append(h("span", { class: "count", text: n + " writing" }));
}
$("#recBtn").onclick = () => { if (S.recording) stopRecording(); else startRecording(); };
async function startRecording(language) {
  const r = await api().start("", language || S.language);
  if (r && !r.ok) { alert(r.error); return; }
  await poll(); go("live", null, true);
}
async function stopRecording() { const r = await api().stop(); await poll(); await refreshList(); if (r && r.id) { hist = []; go("meeting", r.id, true); } }
function renderRecBar() {
  const bar = $("#recbar");
  if (!S.recording || cur.page === "live") { bar.classList.remove("on"); bar.replaceChildren(); return; }
  const t = h("b", { text: stamp(S.elapsed) }); t.id = "recbarTime";
  bar.replaceChildren(h("span", { class: "pulse" }), "Recording ", t, h("span", { class: "grow-1" }),
    h("button", { class: "btn", onclick: () => go("live") }, "Open live view"), h("button", { class: "btn red", onclick: stopRecording }, "Stop"));
  bar.classList.add("on");
}
function startClock() { if (clock) return; clock = setInterval(() => { if (S.recording) { const t = $("#recbarTime"); if (t) t.textContent = stamp(S.elapsed + (Date.now() - elapsedAt) / 1000); } }, 1000); }

// ---------------------------------------------------------------- language chooser
function langPicker(value, onchange) {
